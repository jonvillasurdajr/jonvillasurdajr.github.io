name: SEO Health

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.html"
      - "_config.yml"
      - "*.xml"
      - "*.txt"
      - "*.css"
      - "*.js"
      - "_includes/**"
      - "_layouts/**"
      - "assets/**"
      - "scripts/seo_automation.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the deployed revision
        run: python3 scripts/seo_automation.py wait-revision --site https://jonvillasurdajr.github.io/ --expected-sha "${{ github.sha }}" --timeout 900
      - name: Audit live sitemap URLs
        run: python3 scripts/seo_automation.py audit --sitemap https://jonvillasurdajr.github.io/sitemap.xml
      - name: Open or update SEO health issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Automated SEO health check failing"
          body="The SEO health workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue="$(gh issue list --repo "${{ github.repository }}" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Automated SEO health check failing") | .number' | head -n 1)"
          if [ -n "$issue" ]; then gh issue comment "$issue" --repo "${{ github.repository }}" --body "$body"; else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi
      - name: Close recovered SEO health issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "${{ github.repository }}" --state open --search "Automated SEO health check failing in:title" --json number,title --jq '.[] | select(.title == "Automated SEO health check failing") | .number' | while read -r issue; do gh issue close "$issue" --repo "${{ github.repository }}" --comment "SEO health check recovered: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; done

name: Monthly SEO Review

on:
  schedule:
    - cron: "41 13 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monthly-seo-review
  cancel-in-progress: false

jobs:
  open-review-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create monthly review issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const month = new Date().toISOString().slice(0, 7);
            const title = `Personal SEO review ${month}`;
            const latestCommit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.repository.default_branch
            });
            const latestCommitDate = new Date(latestCommit.data.commit.committer.date);
            const inactiveDays = Math.floor((Date.now() - latestCommitDate.getTime()) / 86400000);
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "seo-review",
              per_page: 100
            });

            if (existing.data.some((issue) => issue.title === title)) {
              core.info(`${title} already exists.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["seo-review"],
              body: [
                "## Search queries",
                "- [ ] `Jon Villasurda`",
                "- [ ] `Jon Villasurda Jr`",
                "- [ ] `Jon Villasurda Sr`",
                "- [ ] `Jon Granger Villasurda`",
                "- [ ] `Jon Villasurda Mercer`",
                "- [ ] `Jon Villasurda CCBHC`",
                "- [ ] `\"Jon Villasurda\" (pleaded OR pled OR guilty OR sentencing)`",
                "- [ ] `\"Jon Villasurda\" (prostitution OR trafficking)`",
                "- [ ] Repeat the exact-name searches in Google Web, Google News, Bing, and DuckDuckGo; review at least five result pages where available.",
                "- [ ] Repeat the exact-name searches with `site:facebook.com`, `site:instagram.com`, `site:x.com`, `site:threads.net`, `site:tiktok.com`, and podcast/news-syndication terms.",
                "- [ ] Separate publisher text from search-engine-generated snippets before requesting a correction; capture screenshots and direct URLs for both.",
                "",
                "## Search Console",
                "- [ ] Inspect the homepage, `/ccbhc/`, `/media/`, `/notes/`, and any newly updated pages.",
                "- [ ] Record indexed pages, impressions, and snippets that need attention.",
                "",
                "## Bing and AI visibility",
                "- [ ] Review Bing Webmaster Tools → AI Performance for new citations, cited pages, and inaccurate context.",
                "- [ ] Check Bing sitemap and URL-submission status for newly published or materially updated pages.",
                "- [ ] Run neutral identity prompts in ChatGPT, Microsoft Copilot, Google Gemini, and Perplexity: `Who is Jon Villasurda Jr.?`, `Who is Jon G. Villasurda Jr.?`, and `Who is Jon Villasurda at Mercer?`.",
                "- [ ] Save the prompt, response date, cited source URLs, and exact inaccurate text for any identity conflation before filing platform feedback or a privacy/correction request.",
                "",
                "## Privacy and data-broker exposure",
                "- [ ] Review Google Results About You for new matches and the status of pending removal requests.",
                "- [ ] Review the current data-broker exposure report and submit opt-outs only for records that belong to this profile.",
                "- [ ] Recheck previously identified broker URLs after 30 days and request Google cache/result removal only when eligible.",
                "- [ ] Do not request removal of legitimate professional pages or authoritative identity sources.",
                "",
                "## Content follow-up",
                "- [ ] Add any new Mercer, conference, publication, media, or presentation reference.",
                "- [ ] Record any professional result that should be linked from the site.",
                "- [ ] Close this issue after notes are captured.",
                "",
                "## Workflow maintenance",
                `- [ ] Scheduled workflows can be disabled after 60 days without a default-branch commit. Latest default-branch commit is ${latestCommitDate.toISOString().slice(0, 10)} (${inactiveDays} days ago); make a commit if this is approaching 60 days.`
              ].join("\n")
            });
      - name: Keep scheduled workflows active
        shell: bash
        run: |
          month="$(date -u +%Y-%m)"
          printf '%s\n' "$month" > .github/automation-heartbeat.txt
          if git diff --quiet -- .github/automation-heartbeat.txt; then
            echo "Automation heartbeat is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/automation-heartbeat.txt
          git commit -m "Maintain scheduled SEO workflows [skip ci]"
          git push

name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "sitemap.xml"
      - "robots.txt"
      - "indexnow-key.txt"
      - "_includes/**"
      - "_layouts/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs
        env:
          INDEXNOW_KEY: 4207b86b12b5d2e71ceba1400f09c585
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST "https://www.bing.com/indexnow" \
            --header "Content-Type: application/json" \
            --data '{
              "host": "jonvillasurdajr.github.io",
              "key": "'"${INDEXNOW_KEY}"'",
              "keyLocation": "https://jonvillasurdajr.github.io/indexnow-key.txt",
              "urlList": [
                "https://jonvillasurdajr.github.io/",
                "https://jonvillasurdajr.github.io/about/",
                "https://jonvillasurdajr.github.io/work/",
                "https://jonvillasurdajr.github.io/ccbhc/",
                "https://jonvillasurdajr.github.io/media/",
                "https://jonvillasurdajr.github.io/cv/",
                "https://jonvillasurdajr.github.io/notes/",
                "https://jonvillasurdajr.github.io/notes/ccbhc-implementation/",
                "https://jonvillasurdajr.github.io/notes/behavioral-health-crisis-systems/",
                "https://jonvillasurdajr.github.io/notes/medicaid-delivery-design/",
                "https://jonvillasurdajr.github.io/notes/healthcare-performance-measures/",
                "https://jonvillasurdajr.github.io/notes/program-evaluation/",
                "https://jonvillasurdajr.github.io/notes/public-sector-analytics/",
                "https://jonvillasurdajr.github.io/publications/"
              ]
            }'

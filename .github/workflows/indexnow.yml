name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "**.html"
      - "_config.yml"
      - "*.xml"
      - "*.txt"
      - "*.css"
      - "*.js"
      - "_includes/**"
      - "_layouts/**"
      - "assets/**"
      - "scripts/seo_automation.py"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait for the deployed revision
        run: python3 scripts/seo_automation.py wait-revision --site https://jonvillasurdajr.github.io/ --expected-sha "${{ github.sha }}" --timeout 900
      - name: Submit live sitemap URLs
        run: python3 scripts/seo_automation.py submit-indexnow --sitemap https://jonvillasurdajr.github.io/sitemap.xml --key-file indexnow-key.txt

<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ page.title | escape }} | {{ site.title | escape }}" />
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="{{ site.title | escape }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="{{ page.title | escape }} | {{ site.title | escape }}" />
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}" />
    <link rel="me" href="{{ site.social_links.github }}" />
    <link rel="me" href="{{ site.social_links.linkedin }}" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --card: rgba(255, 255, 255, 0.84);
        --text: #1d1d1b;
        --muted: #5b564f;
        --accent: #0d5c63;
        --border: rgba(29, 29, 27, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(13, 92, 99, 0.14), transparent 36%),
          linear-gradient(180deg, #f7f2e8 0%, #efe7d8 100%);
      }

      main {
        width: min(760px, calc(100% - 2rem));
        margin: 3rem auto;
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 24px 60px rgba(29, 29, 27, 0.08);
      }

      h1, h2 {
        line-height: 1.1;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2.4rem, 5vw, 4rem);
      }

      h2 {
        margin-top: 2rem;
        font-size: 1.25rem;
      }

      p, li {
        font-size: 1.05rem;
        line-height: 1.7;
      }

      a {
        color: var(--accent);
      }

      ul {
        padding-left: 1.25rem;
      }
    </style>

    {% include website-jsonld.html %}

    {% if page.url == "/about/" %}
      {% include person-jsonld.html %}
      {% include profilepage-about-jsonld.html %}
    {% endif %}
  </head>

  <body>
    <main>
      <nav aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/work/' | relative_url }}">Work</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
      </nav>
      {{ content }}
    </main>
  </body>
</html>

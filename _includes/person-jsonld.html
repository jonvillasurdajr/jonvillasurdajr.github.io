<!-- Person JSON-LD -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "{{ '/#person' | absolute_url }}",
  "url": "{{ '/' | absolute_url }}",
  "image": {
    "@type": "ImageObject",
    "@id": "{{ '/#profile-image' | absolute_url }}",
    "url": {{ site.author.image | jsonify }},
    "contentUrl": {{ site.author.image | jsonify }},
    "caption": "Portrait of Jon G. Villasurda Jr., MPH",
    "about": {
      "@id": "{{ '/#person' | absolute_url }}"
    },
    "width": 460,
    "height": 460
  },
  "mainEntityOfPage": "{{ '/' | absolute_url }}",
  "name": {{ site.author.full_name | jsonify }},
  "alternateName": [
    "Jon G. Villasurda Jr.",
    "Jon Villasurda",
    "Jon Villasurda Jr",
    "Jon Villasurda, Jr."
  ],
  "givenName": "Jon",
  "familyName": "Villasurda",
  "honorificSuffix": "Jr.",
  "description": "Jon Villasurda Jr., MPH, is a Mercer Senior Principal focused on Medicaid, behavioral health, CCBHC implementation, and public-sector health strategy.",
  "disambiguatingDescription": "Michigan healthcare consultant Jon Villasurda Jr., MPH, who is also professionally listed as Jon Villasurda.",
  "jobTitle": {{ site.author.job_title | jsonify }},
  "worksFor": {
    "@type": "Organization",
    "name": "Mercer",
    "url": "https://www.mercer.com/"
  },
  "alumniOf": [
    {
      "@type": "CollegeOrUniversity",
      "name": "University of Michigan",
      "url": "https://umich.edu/"
    }
  ],
  "hasCredential": {
    "@type": "EducationalOccupationalCredential",
    "name": "Master of Public Health",
    "credentialCategory": "degree",
    "educationalLevel": "graduate degree",
    "recognizedBy": {
      "@type": "CollegeOrUniversity",
      "name": "University of Michigan",
      "url": "https://umich.edu/"
    }
  },
  "workLocation": {
    "@type": "Place",
    "name": "Okemos, Michigan",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Okemos",
      "addressRegion": "MI",
      "addressCountry": "US"
    }
  },
  "sameAs": [
    {{ site.social_links.github | jsonify }},
    {{ site.social_links.linkedin | jsonify }},
    {{ site.social_links.chrt | jsonify }}
  ],
  "knowsAbout": [
    "Medicaid",
    "Certified Community Behavioral Health Clinics",
    "Behavioral health policy",
    "Healthcare delivery systems",
    "Public-sector health strategy",
    "Public-sector analytics",
    "Program evaluation"
  ]
}
</script>

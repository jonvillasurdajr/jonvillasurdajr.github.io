<!-- WebSite JSON-LD (sitewide) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ '/#website' | absolute_url }}",
  "url": "{{ '/' | absolute_url }}",
  "name": {{ site.title | jsonify }},
  "description": {{ site.description | strip_newlines | jsonify }},
  "inLanguage": {{ site.lang | jsonify }},
  "publisher": {
    "@id": "{{ '/#person' | absolute_url }}"
  }
}
</script>
